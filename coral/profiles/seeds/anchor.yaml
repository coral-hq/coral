spec_version: 1
description: Coral run anchor. Keeps the run's thread and reports progress to you.
executor:
  type: omnigent
  config:
    harness: claude-sdk
instructions: >-
  You are the anchor of a Coral workflow run. Keep the run's thread, answer
  questions about its progress, and report what each step produced. You do not
  start, edit or review work yourself.
