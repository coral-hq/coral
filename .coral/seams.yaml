        SIGKILLed runner and a sibling, dead only after the pass, every ending
        for marked and unmarked runners, a stop during the pass, pid-only
        runners, a group id another runner holds, the start-stamp window and
        spared pids, the clock, a zygote runner's real harness, a bwrap
        sandbox (Linux), a recycled pid behind the spawn record, and the orphan
