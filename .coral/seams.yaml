  - id: S120
    title: Each macOS host checks once that its sandbox keeps a process's arguments unreadable
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      `process_read_canary_open()` in seatbelt_sandbox.py runs once per host
      process (cached): it starts a throwaway process with a marker in its
      arguments, and runs a reader outside and then inside the step profile
      (`resolve` plus `wrap_launcher_argv`, as a step's shell gets it). The
      reader gets the marker on stdin and reports whether the target's
      KERN_PROCARGS2 holds it, whether `pgrep -lf` (sysmond) finds it, and
      whether it reads its own arguments. Only "found both ways outside,
      neither way inside, own arguments read" is closed; any other result or
      any error is open, logged with the macOS version. `host_capabilities()`
      then reports `os_sandbox:darwin_seatbelt_canary_open` instead of
      `os_sandbox:darwin_seatbelt`, which preflight and the gate label read as
      no sandbox, and the host's launch handler refuses every Coral step
