  - id: S113
    title: A Coral claude CLI keeps its Claude config in a private dir, never the user's ~/.claude
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      Before this seam every claude-sdk CLI wrap granted read and write on
      ~/.claude/{plugins,sessions,session-env,backups}, ~/.claude.json and
      ~/.claude/.credentials.json (each only if it exists), and code in the
      wrap rewrote a plugin hook and planted a session-env script that the
      user's Claude Code runs (measured on macOS 27.2.1 with a throwaway
