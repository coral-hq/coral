  - id: S109
    title: Each sandboxed claude CLI launch gets its own temp dir
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      The claude CLI (2.1.325, read from its binary) keeps its temp dir at
      $CLAUDE_CODE_TMPDIR/claude-<uid>, else /tmp/claude-<uid>, and ignores
      TMPDIR for it; past 44 bytes it sends child-process temp dirs to
      /tmp/claude-<uid>. The CLI wrap granted only
      <gettempdir()>/claude-<uid>, so under seatbelt with TMPDIR set (always
      on macOS) the CLI failed at start with EPERM on /tmp/claude-<uid>.
      Granting /tmp/claude-<uid> would give every step, its siblings and the
      user's own Claude Code sessions one shared directory (R71), so no
      per-user temp dir is granted at all, and the upstream
      <gettempdir()>/claude-<uid> grant is removed: inside the wrap the CLI's
      TMPDIR is the launcher's own scratch, so no CLI used it, and with Linux's
      default TMPDIR it bound the shared /tmp/claude-<uid> over bwrap's
      private /tmp. Instead a
      SandboxPolicy can name an env var and a parent (with_launch_tmpdir). For
      each launch the spawn-time-wrap host pass creates a fresh 0700 dir there
      with mkdtemp, grants only that dir, and exports it; the in-wrap pass
      removes it when the target exits. The parent must pass lstat as a real
      directory (not a symlink) owned by this uid with mode 0700, so a planted
      /tmp/omnigent-<uid> is refused with no grant and a warning that names no
      path. Each dir holds an owner claim for its launcher, and each launch
      first removes sibling c???????? dirs that are this user's private dirs
      with a claim whose launcher is gone; unclaimed, live, foreign-named and
      symlinked entries stay. Under seatbelt the executor asks for
      CLAUDE_CODE_TMPDIR under the runner's harness socket root
      (/tmp/omnigent-<uid> or OMNIGENT_HARNESS_TMP_PARENT, already short and
      0700 for the harness sockets; its sweep touches only ap-* dirs), so the
      CLI's dir is 38 bytes for uid 501, and it warns past 44. The CLI puts its
      messaging socket under XDG_RUNTIME_DIR, which the launcher points at its
      scratch, so no socket lands in this dir. Bwrap gets no launch dir: its
      /tmp is a private tmpfs per launch. A dir a killed launcher leaves
      behind is removed at the next launch under the same root and, since
      S116 (CRL-179), by a claude-sdk executor's sweep after each connect,
      client teardown and close(). Since S116 the in-wrap pass also names its
      CLI in the dir, so a CLI that outlived its killed launcher keeps its dir
      until it exits, unless the launcher died before naming it or could not
      write the name.
    files:
      - omnigent/inner/claude_sdk_executor.py
      - omnigent/inner/sandbox.py
      - tests/inner/test_claude_sdk_executor.py
      - tests/inner/test_sandbox.py
    tests:
      - tests/inner/test_claude_sdk_executor.py
      - tests/inner/test_sandbox.py
      - tests/e2e/coral/test_skeleton.py
    budget_lines: 120
    budget_exception:
      lines: 211
      reason: >-
        tests/inner/test_sandbox.py (211 added lines): three helpers and the
        launch dir tests (the fields on the wire and through clones, fresh
