  - id: S50
    title: Extension tool providers from entry points; host token line
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      `omnigent/tools/extensions.py` loads tool providers from installed
      omnigent.tool_providers entry points. Each names a zero-argument
      factory returning an object with tool_set(spec) (an ExtensionToolSet
      of OpenAI-format schemas and framework instructions, or None; a cheap,
      non-raising, pure function of the spec), server_dispatched_names() and
      host_capabilities() (both read once per process). Entry points load in
      (name, value) order, once per process on first use and never at
      import, under a lock so racing first calls run each factory once; one
      that fails to import, call or conform is skipped with a warning naming
      its distribution, and each loaded provider is logged at info with its
      distribution. tool_set(spec) and every check of its result run inside
      a guard: a raising provider is skipped, and a set with any malformed
      part is dropped whole (not an ExtensionToolSet, non-tuple fields, a
      schema that is not plain JSON through a json round trip, including
      sets, mapping proxies, non-finite numbers, cycles and recursion-limit
      depth, a schema nested deeper than 64, not a function, an invalid
      name by fullmatch, a name with `__`, no string description,
      parameters not a dict, a duplicate name, a non-string instruction).
      Accepted schemas are returned as fresh plain-JSON copies. A tool or
      server-dispatched name that two providers offer is served by neither,
      logged with both distributions. Server-dispatched names are validated
      like tool names and collected once. Host tokens are non-empty strings
      of at most 128 characters without whitespace and without the reserved
      `os_sandbox:` prefix, at most 16 per provider, read once and
      deduplicated in order; a provider that raises or breaks a name or
      token rule contributes none of them. Every provider problem is logged
      once per process. `host_capabilities()` in `omnigent/host/frames.py`
      appends the providers' tokens that the host does not already send,
      after `os_sandbox:<backend>`, importing the loader inside the function
      so importing frames.py loads no entry point. With no provider
      installed every result is empty and Omnigent behaves as before. The
      module imports only the standard library and `omnigent.tools.base`, so
      a host builds its hello without database modules. Installed metadata
      changes only after uv sync, so tests pass entry points or patch
      default_tool_providers and reset the caches with
      clear_tool_provider_caches; the S102 exact-list hello tests serve no
      providers. pyproject.toml declares Coral's own provider, coral =
      coral.omni.runner.tool_provider:tool_provider, so hosts advertise
      coral_runner:2 (none while CORAL_DISABLE_HOST_ENTRY_POINTS is set); its
      production catalog lists both engine tools, which it offers by stance
      with their prompt text and names as server-dispatched. The
      `_connect_host` helper in
      tests/server/integration/test_session_host_launch.py takes optional
      hello capabilities so Coral's facade tests can connect a host with the
      token; existing callers send none. It also exposes
      is_extension_tool_name(name) (a valid tool name without `__`) and
      is_framework_tool_name(name) (any `sys_` name, a builtin registry name
      or a skill tool; it imports the builtin registry only when called),
      which S7 and S10 share.
