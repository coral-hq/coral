  - id: S123
    title: A zygote-forked runner's exec-time environment holds no credential-shaped name (the zygote starts from the allow-listed runner environment); a direct-spawned runner takes its auth tokens from an inherited socket and holds them in memory
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      A forked child's readable environment (/proc/<pid>/environ on Linux,
      KERN_PROCARGS2 on macOS) is its parent's exec-time block, whatever it
      later does to os.environ. The host exec'd the runner zygote with the
      daemon's whole environment, so the zygote, every runner it forked and
      every harness those runners forked exposed every host secret to
      same-user readers outside the sandbox, past the runner env allow-list.
      HostProcess now builds its ZygoteManager with base_env, a callable read
      at each zygote spawn, so a respawn sees the daemon's environment then;
      ZygoteManager() without it keeps os.environ (tests only), and a
      base_env that raises leaves no control socket open.
      _zygote_base_env keeps the names _runner_allowlisted_env admits (the
      runner allow-list by exact name and by the LC_, MLFLOW_, OTEL_ and
      OMNIGENT_OTEL_ prefixes; _build_runner_env uses the same filter and its
      output is unchanged) minus credential-shaped names (any case: TOKEN,
      SECRET, PASSWORD, PASSWD, CREDENTIAL, BEARER, API_KEY, PRIVATE_KEY or
      COOKIE in the name, the probe 15 set, a HARNESS_CLAUDE_SDK_ prefix, a
      _HEADERS, _PAT, _CRED or _CREDS suffix, and
      OMNIGENT_DEBUG_LOG_CLIENT_SECRET,
      OMNIGENT_DEBUG_LOG_CLIENT_SECRET_COMMAND and
      OMNIGENT_DATABRICKS_EXTRA_HEADERS by name) and minus any name whose
      value holds URL userinfo (scheme://user@host), plus MALLOC_ARENA_MAX,
      MALLOC_TRIM_THRESHOLD_, LD_LIBRARY_PATH and PYTHONHOME when the daemon
      has them, since glibc, the loader and the interpreter read them once at
      exec. LD_LIBRARY_PATH and PYTHONPATH keep only their absolute entries,
      and are dropped when none remains, because an empty or relative entry
      searches the working directory, for a fork a step-writable checkout.
      The malloc defaults are still added by setdefault. Runners get every
      allow-listed and forwarded name through the fork payload, which lives
      in heap memory only. Names outside the allow-list that the zygote read
      at its exec or import now behave as on direct spawn, where they were
      never passed; for example OMNIGENT_HARNESS_SHUTDOWN_TIMEOUT_S,
      OMNIGENT_HARNESS_HARD_EXIT_TIMEOUT_S, WEBSOCKETS_*,
      PYDANTIC_DISABLE_PLUGINS, PSUTIL_DEBUG, PYTHONUSERBASE, PYTHONTZPATH,
      the interpreter's startup variables (PYTHONDONTWRITEBYTECODE,
      PYTHONPYCACHEPREFIX, PYTHONWARNINGS, PYTHONUNBUFFERED,
      PYTHONFAULTHANDLER and the like), OPENSSL_CONF, and in the deferred
      graph PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION,
      GOOGLE_API_USE_CLIENT_CERTIFICATE and DATABRICKS_SDK_UPSTREAM*. Names
      listed in OMNIGENT_RUNNER_ENV_PASSTHROUGH are the exception: direct
      spawn passes them at exec, but the zygote's own env does not hold them,
      so a zygote-forked runner gets them only through the payload, after
      the zygote's exec and imports have read their environment. Measured on
      macOS with the real zygote and fake host secrets: the zygote, a forked
      runner and the harness it forked expose only allow-listed names, the
      control fd and the platform's __CF_USER_TEXT_ENCODING and
      __PYVENV_LAUNCHER__. A direct-spawned runner (zygote off or failed)
      no longer gets any name of RUNNER_AUTH_SECRET_ENV_VARS in env= on
      POSIX: OMNIGENT_RUNNER_TUNNEL_BINDING_TOKEN,
      OMNIGENT_RUNNER_INITIAL_AUTH_TOKEN and, since S118 added it to that
      list, the allow-listed OMNIGENT_RUNNER_TUNNEL_TOKEN when the runner's
      env holds it. _spawn_runner_proc moves them through
      launch_secrets_in_socket into an AF_UNIX stream
      socket pair (launch_secrets_socket: one JSON object of at most 16 KiB,
      room for a bearer JWT with group claims, sent through a non-blocking
      end whose send buffer is first grown to 32 KiB where the default is
      smaller, as on macOS (8 KiB), and that is shut down and closed
      before the spawn; a child's end that a closed standard stream left at
      fd 0-2 moves above 2, where the child's own stdio cannot replace it),
      names the child's end in OMNIGENT_RUNNER_LAUNCH_FD (no credential word,
      so probe 15 and _credential_shaped_env_name do not flag it), adds it to
      the terminal mirror's pass_fds and closes it once Popen returns or
      raises. Unlike a pipe, a socket cannot be reopened through
      /proc/<pid>/fd, so on Linux a same-user reader cannot take or replace
      the payload while the runner boots. A send failure, the size cap
      included, is an OSError that fails the launch through _launch_failed,
      with no env fallback; Windows keeps env delivery. The runner's main()
      sets its boot signal disposition, then _hold_runner_auth_secrets:
      adopt_launch_secrets reads the socket (a socket only, non-blocking
      under 5 s, a non-empty JSON object of strings naming only names of
      that list, each once, otherwise one stderr line that names no value and
      exit 2; one str as the allowed names is a TypeError), and
      take_runner_auth_secrets moves every name of the list out of
      os.environ (a zygote
      fork's payload or a CLI-local runner's environment) and the sent values
      into a holder in omnigent/runner/identity.py. _make_auth_token_factory
      and _runner_tunnel_binding_token_from_env (the pi-native launch reads
      through it) read the holder, falling back to os.environ, and the
      initial bearer is still consumed on use, so no child of the runner
      inherits any of them whatever environment it is given, the env=None
      gh and git spawns included. _runner_allowlisted_env and
      _build_runner_env never carry OMNIGENT_RUNNER_LAUNCH_FD, not even when
      passthrough names it, so a stale fd number in the daemon's env reaches
      neither a runner nor the zygote. adopt_launch_secrets takes the target
      mapping, the fd variable and the allowed names, so a harness can reuse
      it. _build_runner_env also names the credentials it forwards
      (HARNESS_CREDENTIAL_ENV_VARS, passthrough and provider config refs
      present in the daemon's env), sorted and comma-separated, names only,
      in OMNIGENT_RUNNER_FORWARDED_NAMES (no credential word, so probe 15 and
      _credential_shaped_env_name do not flag it; never a stale or
      passthrough-listed copy; absent when nothing is forwarded), so a Coral
      claude-sdk harness can keep each of them out of its CLI's environment;
      env_name_list parses the passthrough list for the host and that
      harness. Measured on macOS: outside the sandbox the identity stack reads the
      direct-spawned runner's environment and finds neither token
      (own_runner_mint and own_runner_bearer not_present) and no
      credential-like name (own_runner_environ.names none). Residuals: a
      direct-spawned runner's env= still carries the
      credential-shaped allow-listed names and the forwarded credentials
      (CRL-197); a CLI-local runner still gets its binding token at exec
      (CRL-197) and a Windows runner its auth tokens (accepted); a credential in
      the value of a name that is not credential-shaped, outside URL
      userinfo (such as a signed query string), still reaches the zygote.
      The macOS sandbox lane (S119) also runs on changes to
      omnigent/host/runner_zygote.py, omnigent/runner/identity.py and
      omnigent/runner/launch_secrets.py, which probe 15's darwin pins now
      depend on; tests/coral/test_ci_lane.py pins those paths.
    files:
      - .github/workflows/macos-sandbox.yml
      - omnigent/host/connect.py
      - omnigent/host/runner_zygote.py
      - omnigent/runner/_entry.py
      - omnigent/runner/identity.py
      - omnigent/runner/launch_secrets.py
      - tests/host/test_connect.py
      - tests/host/test_runner_zygote.py
      - tests/runner/test_identity.py
      - tests/runner/test_launch_secrets.py
      - tests/runner/test_runner_entry.py
    tests:
      - tests/host/test_connect.py
      - tests/host/test_runner_zygote.py
      - tests/runner/test_identity.py
      - tests/runner/test_launch_secrets.py
      - tests/runner/test_runner_entry.py
      - tests/e2e/coral/test_sandbox_probe.py
    budget_lines: 120
    budget_exception:
      lines: 446
      reason: >-
        Counted with git diff --numstat origin/development (added plus
        removed lines; a new file counts every line), so a file shared with
        S124 counts both seams' lines. tests/runner/test_launch_secrets.py
        (446, new): the round trip at and under the cap, every refused
        payload (empty, duplicate-name and one byte over the cap included)
        and descriptor kind (a pipe and a file among them), one name as the
        allowed names, the writer's one-byte-over-the-cap and full-socket
        cases, the socket context, a real runner sent a 12 KiB payload
        whose readable environment and env=None child lack the tokens,
        concurrent launches that never cross sockets, and a daemon without
        stdin or stdout whose child still reads its socket.
        tests/host/test_connect.py (410, S123 and S124: 18 for S124): the
        zygote base env, search path and HostProcess wiring tests, then the
        rewritten direct-spawn launch test, the Windows env-delivery test
        and the fail-closed launch cases (all three keep names, digests and
        the socket's fd, never the spawn's env), the passthrough fd-variable
        and name checks, the direct fallback with the terminal mirror, and the
        forwarded-names list with a config-ref key and with nothing
        forwarded. omnigent/runner/launch_secrets.py (230, new, 7 for S124):
        the socket writer with its send buffer, the spawn context and the
