      - web/public/licenses/geist-mono-OFL-1.1.txt
      - web/public/licenses/newsreader-OFL-1.1.txt
    tests: []
    budget_lines: 10
    budget_exception:
      lines: 250
      reason: >-
        NOTICE gains the append-only Coral addendum; MODIFICATIONS.md (one row
        per changed file) and the verbatim OFL licence texts are new Coral files
        outside allowed_roots.
      approver: pending
    anchor_exempt:
      - web/public/licenses/geist-mono-OFL-1.1.txt
