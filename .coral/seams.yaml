  - id: S43
    title: Runner turn outcomes that survive a buffered continuation
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      The runner's session.status edges for a turn end carry turn_outcome
      (completed, cancelled or failed) and, when known, turn_response_id: the
      response the turn ended, read before the live response is released. That
      covers the stream end (interrupted or cancelled, completed on idle or
      waiting, failed), the cancelled drain, the desync failure and the
      session-init failure (no response yet, so no id). The existing
      response_id key, the buffered-input suppression and the native drop rules
      are unchanged. A turn whose stream ends with buffered input publishes
      nothing and carries its outcome to the next turn start's running edge
      (any turn start, not only the drain's), or to an idle edge when the drain
      finds the queue emptied (either empty-queue exit); deleting a session
      drops a carried outcome. A real interrupt force-cancels the runner task
      instead: the cancelled drain publishes idle with cancelled and the
      response id even with input buffered, and the turn's teardown then
      carries an unkeyed cancelled to the continuation's running edge. Either
      way the interrupted response gets exactly one keyed runner-reported
      outcome.
      The relay passes both keys to _publish_status, which hands them to
      status-edge observers only; old runners send neither key, and an
      unknown outcome drops the response id with it.
