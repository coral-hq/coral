        host pass's grant and export, and removal when the target exits or
        fails). The other files are within budget:
        omnigent/inner/sandbox.py 115, omnigent/inner/claude_sdk_executor.py
        31, tests/inner/test_claude_sdk_executor.py 84.
      approver: nicholasjano (delegated)
