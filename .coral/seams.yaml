  - id: S115
    title: Every bwrap or seatbelt claude CLI keeps its Claude config in a private dir, seeded for non-Coral agents
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      Before this seam a non-Coral claude-sdk CLI wrap granted read and write
      on ~/.claude/{plugins,sessions,session-env,backups}, ~/.claude.json and
      .credentials.json, and a user MCP server from ~/.claude.json, started
      inside the wrap, rewrote a plugin hook, planted a session-env script and
      rewrote .claude.json (measured on macOS 27.2.1 with a throwaway home and
      claude 2.1.325). sandbox.py: scratch_dir_seed names (entry, absolute
      source file) pairs that the in-wrap pass copies into S113's private dir
      as fresh 0600 files before scratch_dir_files, except for a version query
      (-v or --version alone), which its caller may kill before the launcher
      cleans up; the copy follows no link, does not block on a FIFO, and takes
      only a regular file this user owns and no one else can write;
      with_scratch_dir_env grants each source as a read root; the field
      travels the launcher wire and survives clones, and
      a malformed one fails the launch. Executor: both wrap paths isolate by
      default on every backend but Windows' job object, which confines no
      files and keeps the shared grants; no production caller passes
      isolate_config=False. A non-Coral spec whose skills load user settings
      gets a seed filtered from the global config the CLI would read: the
      user's mcpServers, userID and legacy env, and per project only the trust
      and MCP enable/disable keys not at their default. Project mcpServers,
      oauthAccount, primaryApiKey, any Claude sign-in credential and every
      other key are never copied. An unusable config, one over 16 MB
      included, gives an empty seed, so no user MCP servers, and a warning in
      the runner log. The seed is written just before each wrapped launch and
      removed on close; its dir is made exclusively, again after a temp
      cleaner removed it, and one found there must be this user's own 0700
      dir. skills none and Coral get an empty dir, and Coral keeps S113
      unchanged. Under the old wrap only those MCP servers reached the CLI
      (measured), so it loads the same MCP servers as before.
      Breaking: a stored subscription login no longer reaches these CLIs, and
      on Linux neither do the MCP OAuth sign-ins in the CLI's credential
      store. A start warning and the auth error name an API key, a gateway or
      CLAUDE_CODE_OAUTH_TOKEN, and a seeded MCP server that the host signs in
      is named in a warning. The Sentinel and scanner example configs carry
      the auth note. Main residuals: CLIs that run unwrapped by design (no
      ticket) or because their sandbox could not be applied (CRL-183); the
      seed copy's secrets and CLAUDE_CODE_OAUTH_TOKEN, both readable in the
      sandbox (CRL-197); a seed copy left in a launch scratch after a kill,
      and a scratch without one at each connect from the SDK's -v check
      (CRL-179; removed by S116 once the launch has exited, at a claude-sdk
      executor's next connect, client teardown or close, or, after a killed
      harness, when the next claude-sdk executor with the same temp dir
      connects or closes; copies from before S116 and the other residuals in
      the CRL-179 addendum stay); a working dir or path grant above the home,
      which the top-level dotfile mask does not cover (CRL-184); project
      config in the working dir (CRL-181); and the inbox sockets (CRL-174). No
      CI lane runs macOS (CRL-170). Mechanism, evidence and the full residual
      list: ADR-05, "Addendum: CRL-178 Claude config isolation for every
      sandboxed agent".
    files:
