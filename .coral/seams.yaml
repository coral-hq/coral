  - id: S5
    title: Crash-isolated, copy-on-write elicitation observers
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      pending_elicitations had one observer slot, owned by the sub-agent block
      notifier, and called it with no try/except, so a raising observer
      propagated out of record_publish and session_stream.publish before the
      SSE fan-out and dropped delivery of the prompt. add_elicitation_observer
      now adds further observers beside that primary slot and returns an
      idempotent uninstaller that removes only its own registration (the exact
      object it added, first match, so a bound method or an observer added
      twice is handled). Added observers are a tuple replaced as a whole under
      a writers-only lock; each publish reads the primary and the tuple once
      without a lock. _notify_observer calls the primary, then the added
      observers in registration order, each in its own try/except: a failure
      logs one WARNING traceback per observer name (log_once), then a DEBUG
      line with the session id, and never stops the other observers, the
