  - id: S124
    title: A Coral step's Claude CLI never holds the model credential (per-session token at the executor's loopback proxy); harness config never reaches any CLI
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      The SDK copies the harness's whole os.environ into every Claude CLI it
      starts, so the HARNESS_CLAUDE_SDK_* config, the printf %s '<key>'
      helper among it, reached every claude-sdk CLI's environment. Now
      create_app() moves every HARNESS_CLAUDE_SDK_* name out of os.environ
      once (_take_harness_config) and every executor build, rebuilds
      included, reads that config; only OMNIGENT_RUNNER_WORKSPACE still comes
      from os.environ, and the resolvers read os.environ when called with no
      config. This holds for every agent and on every platform. For
      a Coral harness (HARNESS_CLAUDE_SDK_REQUIRE_API_CREDENTIAL=1) on POSIX,
      _scrub_coral_environ then pops, never to restore, every name in the
      host's HARNESS_CREDENTIAL_ENV_VARS, every name
      OMNIGENT_RUNNER_ENV_PASSTHROUGH or the host's
      OMNIGENT_RUNNER_FORWARDED_NAMES lists (so a second provider's config-ref
      key goes too; that variable reaches the harness through the runner's
      env on both the fork and the exec path), CLAUDE_CODE_USE_ and
      CLAUDE_CODE_SKIP_*_AUTH for
      Bedrock, Vertex, Foundry, Mantle, Anthropic AWS and Anthropic Google
      Cloud (every provider switch the pinned CLI 2.1.325 reads),
      CLAUDE_CODE_USE_GATEWAY, every name whose value holds the configured
      static key when that key has at least 20 characters (a shorter one also
      occurs in ordinary values such as /usr/local/bin), and any proxy setting
      (HTTP_PROXY, HTTPS_PROXY, NO_PROXY or ALL_PROXY in any case) whose value
      holds an @. It never pops PATH, HOME, TMPDIR, TMP, TEMP, USER, LOGNAME,
      SHELL, LANG, LC_*, TERM, ANTHROPIC_MODEL and its OMNIGENT_ alias,
      userinfo-free proxy settings, SSL_CERT_FILE, SSL_CERT_DIR,
      REQUESTS_CA_BUNDLE or NODE_EXTRA_CA_CERTS. static_printf_value (in
      claude_gateway_shim.py, for the credential proxy to reuse) reads that
      key back only from the exact "printf %s " + shlex.quote(key) form; an
      empty literal is ignored. static_credential_literal gives the one form
      of that key used everywhere, stripped as the proxy sends it (None when
      it is not one printable token), so the scrub, the fail-closed check and
      the model listing find and send a key configured with a trailing
      newline without it. The environment from before the scrub goes
      to the executor as credential_env, for running the credential command,
      never the CLI. A direct-exec harness (zygote off or failed) on POSIX no
      longer gets HARNESS_CLAUDE_SDK_API_KEY_HELPER or
      HARNESS_CLAUDE_SDK_GATEWAY_AUTH_COMMAND in its exec-time environment:
      the process manager sends them through launch_secrets_in_socket and
      pass_fds, named by OMNIGENT_HARNESS_LAUNCH_FD, and create_app() reads
      that socket (adopt_launch_secrets, only those two names) straight into
      the config it took, never into os.environ; a refused socket exits 2
      with one line naming no value, and a socket that cannot be sent fails
      the spawn as a RuntimeError naming the error type only. Only the claude-sdk harness module uses the socket; other
      harness modules, zygote forks (whose payload reaches only the forked
      harness's memory, where the config is then taken) and Windows keep env
      delivery, and no harness spawn env or env the host builds carries
      OMNIGENT_HARNESS_LAUNCH_FD. Measured on macOS: a direct-exec harness's
      readable environment lacks both names while its executor config has
      them, and the Coral stack tests run a step through a zygote-forked and
      a direct-exec harness. A browser test that found the CLI by
      HARNESS_CLAUDE_SDK_AGENT_NAME in its environment now finds it by the
      session's harness among its parents, skipping ancestors whose command
      line it cannot read and stopping at the runner. ClaudeGatewayShim gains
      a credential mode (credential=UpstreamCredential): the CLI holds only
      session_token ("session-" and token_urlsafe(32), so it never has the
      shape of an Anthropic key). Before reading the body the shim
      requires every presented x-api-key and authorization Bearer to equal it
      (as bytes, hmac.compare_digest; at least one, none repeated), else 401.
      It forwards only POST /v1/messages, POST /v1/messages/count_tokens, GET
      /v1/models and GET /v1/models/<id> (else 404, logged by method and
      segment count); it builds the upstream path from raw_path and answers
      400 to a path that is not origin-form or has an empty, . or .. segment,
      @, a backslash or an encoded dot, slash, backslash, @, ? or #, and to a
      joined URL that leaves the upstream's scheme, host, port or base path,
      or to a model id outside [A-Za-z0-9][A-Za-z0-9._:-]{0,127}; a body over
      32 MiB gets 413. Its uvicorn runs the h11 parser (a request head is
      capped at 16 KiB) with no connection limit, which amends R1 item 4:
      idle unauthenticated sockets would fill a limit and refuse the CLI.
      It refuses to start on a plain http upstream that is not loopback
      (OSError naming the scheme only; S125 widens this check), drops
      X-Original-URL, X-Rewrite-URL,
      X-HTTP-Method-Override, X-HTTP-Method, X-Method-Override, Forwarded and
      every X-Forwarded-* header, forwards nothing for a CLI that leaves
      mid-upload, closes the upstream response when the CLI leaves
      mid-answer, and aclose() cancels exchanges still running, so a
      credential command loses its process group.
      The real credential replaces the token in the header form(s) the CLI
      used; an upstream 401 refreshes a command credential and resends once
      per request and at most once per 30 s. UpstreamCredential holds a
      printf %s literal without a shell; any other command runs as /bin/sh -c
      in its own session from Path.home() with the env snapshot its caller
      passes, stdout capped at 64 KiB, stderr discarded, killed with its
      process group after 600 s or on cancellation, one run at a time, cached
      for its TTL (900 s by default) and a failure for 30 s; a value must
      strip to one printable ASCII token of at most 4 KiB. In credential mode
      every error answer and log line names exception types only (a failed
      credential gets a fixed 401, anything else a 502 naming the type), and
      the upstream client's httpx and httpcore records below WARNING are
      dropped while a credential request runs. upstream_proxy and
      upstream_ca_file configure the upstream client (redirects not followed,
      the CA added to httpx's default trust); a client that cannot be built
      fails start() with an OSError naming the type. Without a credential,
      proxy or CA the shim's client, limits and forwarding are unchanged; the
      listening log line names the upstream without userinfo, query or
      fragment in both modes. Measured under the httptools and h11 parsers:
      traversal, @, absolute-form and percent-encoded targets reach no
      upstream and run no command; under httptools, which the credential
      mode no longer runs, an absolute-form target naming an allowed route
      reaches only the configured upstream. A Coral (require_api_credential)
      gateway executor on POSIX now uses that mode. It builds one
      UpstreamCredential from the real command, the CLI's helper TTL and the
      pre-scrub environment, and its shim holds it: the CLI's settings carry
      apiKeyHelper printf %s "$OMNIGENT_CLAUDE_PROXY_TOKEN", and its options
      env the loopback base URL, the shim's session token and
      127.0.0.1,localhost appended to the NO_PROXY and no_proxy it would
      inherit, so the real command is in none of its settings, environment
      or arguments, and there is no fallback that puts the token on argv.
      The shim's upstream hop takes the proxy the pre-scrub environment names
      for the upstream (the scheme's own name, then ALL_PROXY, read as urllib
      reads them: a lower-case name that is set, even to nothing, hides its
      upper-case twin; none when NO_PROXY covers the host), so a proxy with
      userinfo reaches the upstream client and never the CLI. A loopback
      upstream gets no proxy, and with none named the shim's client for it
      ignores the environment's proxies (trust_env off, SSL_CERT_FILE and
      SSL_CERT_DIR still read). The gateway model
      listing takes its bearer from the same credential, waiting at most 15 s
      for a command as its own run did, and for every
      executor a static printf %s key goes to the listing as a value, in its
      stripped form, so no shell starts; a key that is not one printable
      token lists nothing. A listing or credential failure is logged by
      exception type only, in the executor and in
      omnigent/models/model_catalog.py's DEBUG line, which no longer carries
      the traceback (a client's error text can quote the header it refused).
      A proxied executor whose gateway URL is plain http to another machine
      refuses the turn (coral_credential_upstream_refused, naming the scheme
      at most) before the listing sends the credential anywhere. Before
      every connect of a proxied CLI, a static key of at
      least 20 characters found in any value of os.environ plus the options
      env, or in the settings or extra arguments, refuses the turn
      (coral_credential_exposed) naming variable names only; the check is a
      substring search for the stripped key and its JSON-escaped spelling, so
      it does not see an encoded or split copy, a key under 20 characters, a
      command credential's value, or other options such as the system
      prompt. close() awaits
      clients evicted on cancel before it stops the shim, so no CLI outlives
      the port it calls; a close() that is cancelled (the adapter bounds it
      at 3 s) or fails still stops the shim, shielded from a second cancel,
      and removes the private config dir and seed, for every gateway
      executor, and a credential command still running with no shim is
      stopped too. Measured on macOS 27.2 with claude 2.1.325: probe 15
      run outside the sandbox reads the reviewer's runner and CLI, the host
      and the step's own CLI and finds the API key in none of their
      environments or command lines (before this, on both CLIs' command
      lines), each CLI's environment names OMNIGENT_CLAUDE_PROXY_TOKEN and no
      HARNESS_CLAUDE_SDK_* name, and from the step's shell the step's own
      proxy refuses a model request with no key, with a wrong key and on a
      path that climbs to the model route (credential_proxy pinned refused,
      closed, in the single-user and identity probes; the Linux pins are set
      by reasoning until the coral-e2e lane runs), the mock's ledger holding
      none of those requests and the session token in no request body (it
      records no headers; the unit tests cover those). The pinned CLI needed no
      route beyond the four the shim forwards. A Coral executor on an API
      key with no gateway now uses the same proxy (activation is
      require_api_credential, a credential command and POSIX). Its upstream
      is the ANTHROPIC_BASE_URL of the pre-scrub environment (the executor's
      own environment when it was given none), else
      https://api.anthropic.com, so the host's endpoint, which the scrub
      takes from the CLI, still decides where the key goes, and a helper
      command that reads a forwarded variable runs with that environment.
      Its credential is cached for that environment's
      CLAUDE_CODE_API_KEY_HELPER_TTL_MS (0 included: the value is never reused,
      as in the CLI), else the pinned CLI's own 300 s. The transport refusal
      and the fail-closed check apply to it, and a proxied CLI's upstream URL
      with whitespace around it, a control character, a query or a fragment
      refuses the turn under the same code, naming no part of the URL, where
      the proxy would have failed every request after a CLI started. It gets no
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS or CLAUDE_CODE_USE_GATEWAY. Its
      CLI gets _CLAUDE_CODE_ASSUME_FIRST_PARTY_BASE_URL=1 exactly when that
      upstream is the Anthropic API by the CLI's own rule, which is a host
      match on api.anthropic.com with no non-default port; the executor never
      says yes for a URL with userinfo, a backslash or whitespace. The CLI
      reads that private switch at every site of its effective first-party
      check, so behind the loopback URL it keeps the betas, attribution
      fields and model handling it had on the Anthropic API; a gateway CLI
      never gets it. The next three statements are read from one build
      (2.1.325), not measured. First, the switch does not reach the sites
      that test the raw
      URL: the side-query beta on hook-agent and named model calls, the
      cc_project attribution tag, the resume cache warm-up, a server-flagged
      reminder experiment, and one resend without thinking.display after an
      upstream 400 or 422. Second, a CLI whose only credential is a key helper
      is not eligible for Console-managed settings or policy limits on any base
      URL (both checks ask for a key with the helper skipped), and a Coral
      step's key has always been a helper's, so neither applied before this
      seam and nothing is lost. Third, while its base URL is not an Anthropic
      host the CLI withholds a key that is not Anthropic-shaped (sk-ant-, or
