  - id: S1
    title: Status-edge observers with origin and turn outcome
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      session_live_state gains a process-wide, lock-guarded registry of named
      status-edge observers (one static, namespaced name per component; a
      replacement by name logs a warning). _publish_status notifies once per
      published edge, after the stream publish so a re-reading observer finds
      every cache updated; the sticky-failed return notifies nothing. Each
      SessionStatusEdge carries origin, turn_outcome (completed, cancelled or
      failed; anything else is dropped), turn_response_id (the ended turn's id;
      it never opens a turn), the call's error, failure_origin (failed edges
      only), workspace and observed_at_ms. Runner-supplied values are bounded
      on construction and never raise: ids over 128 characters are dropped,
      error_code and blocked_on are cut to 128 characters and error_message to
      4,500. Edges from every workspace reach every observer, so observers
      match on (workspace_id, session_id). Nothing new reaches the stream
      payload, the caches or the scheduled-run hook, so without an observer
      behaviour is unchanged. Observers run on the publishing thread (orphan
      reconcile publishes from a worker thread), each in its own try/except; a
      failing observer logs one traceback per name, then debug lines. Origins:
      archive_idle (the archived session's own stop settlement; sessions
      sharing its runner report unknown), runner_disconnect (the relay's
      mid-turn drop, failed with its turn id), relay_turn_end (the relay's
      runner-recovered idle, with the runner's turn_outcome and
      turn_response_id when sent) and status_probe (a cold-cache probe fill);
      every other site keeps unknown. The three intentional-stop idle edges
      (stop and archive settlement, the offline sweep's settlement, the
      relay's stop idle) report cancelled with the active response id only
      when the session is still running at the publish (the cache, or the
      persisted status when it is cold); a waiting session's turn had already
      ended, and whichever of settlement and relay drop publishes second
      reports no outcome, so a stopped turn is reported cancelled once. The
      offline sweep's mid-turn failure reports failed with its turn id when one
      is known. The two writers that bypass _publish_status notify themselves:
      the runner-recovered status once after its stream publish (never on its
      early returns) and the status probe only when it fills a cold cache with
      idle, running, waiting or failed. Every notified edge with both an
      outcome and a response id is recorded per (workspace_id, session_id):
      the last 8 response ids per session, at most 4,096 sessions (least
      recently reported evicted first), dropped when the session is deleted.
      The server-inferred sites (the three intentional-stop idles and the
      relay and offline-sweep disconnect failures) report an outcome only for
      a response with none recorded; otherwise their edge carries no outcome
      and no turn id. The active response can still name a turn the runner
      already reported (a waiting turn end, or a buffered continuation before
      its first response), so one response never gets a second, contradicting
      outcome from an inference. Runner-relayed outcomes are not gated; BA-3
      (DESIGN-DECISIONS.md) sets the precedence consumers apply between them
      and the inferred ones. turn_fields passes a turn response id only with a
      known outcome.
    files:
      - omnigent/server/session_live_state.py
      - omnigent/server/routes/_sessions/helpers.py
      - omnigent/server/routes/_sessions/orchestration.py
      - omnigent/server/routes/sessions/routes_events.py
      - tests/server/test_session_live_state.py
      - tests/server/routes/test_intentional_runner_stop.py
      - tests/server/routes/test_disconnect_outcome_recovery.py
      - tests/server/routes/test_sessions_snapshot.py
      - tests/server/routes/test_sessions_runner_relay.py
    tests:
      - tests/server/test_session_live_state.py
      - tests/server/routes/test_intentional_runner_stop.py
      - tests/server/routes/test_disconnect_outcome_recovery.py
      - tests/server/routes/test_sessions_snapshot.py
      - tests/server/routes/test_sessions_runner_relay.py
    budget_lines: 40
    budget_exception:
      lines: 544
      reason: >-
        Changed lines against the upstream base, per file.
