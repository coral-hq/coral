  - id: S71
    title: Host frame handlers keep their subprocess exit statuses
    owner: WS-WORKSPACE
    status: landed
    category: upstreamable
    note: >-
      The host's orphan reaper could collect a git/gh/CLI child's exit status
      before subprocess did, so a failed command reported 0. The reaper now
      reaps a child only when the previous sweep, 2 s earlier, already saw it
      as a zombie with the same PID and start time. An owner that waits on its
      child collects it within milliseconds of exit, so this covers every
      spawner, including the ones no guard covers: the launch preflight
      --version probes, model_options, MCP stdio and opencode-serve spawns,
      the pr_resource discovery pool and the azure-devops-fetch thread.
      Sweeps run only from the reaper loop; run() no longer drains once at
      shutdown, since one sweep cannot confirm a zombie, and the children an
      exiting host leaves go to init or the next subreaper. The fs request,
      fs write, skills, skill-content and credential-detection frames and the
      worktree create/remove/list handlers still run through
      _run_host_subprocess_in_thread, which keeps the reaper paused until the
      worker thread exits, even when a reconnect cancels the frame. The pause
      stays as belt-and-braces: subprocess.run collects its child only after
      the child's output pipes close, so a child whose background grandchild
      holds a pipe open stays a zombie across sweeps. With sh -c 'sleep 5 &
      exit 42' at the 2 s interval, an unguarded run() reports 0 and a
      guarded one 42; unguarded spawners keep that gap. A pause longer than
      60 s logs a warning, at most once every 5 minutes. The host builds its
      WorkspaceReaders with start_registry=False, so the change registry's
      one-time untracked-cache git probe (a persisted speed-up only) never
      runs after the guarded handler returns. A guarded worker that never
      returns pauses the reaper until restart, so both WorkspaceReader
      file-content reads open non-blocking and refuse non-regular files: a
      FIFO in the workspace is refused instead of blocking the read. Other
      blocking reads can still hold a guarded worker: a hung network mount
      (NFS, FUSE, SMB), a stalled skills-bundle download, or a FIFO named
      SKILL.md in a skills directory (skill discovery checks exists() and
      then reads it). Known costs: the reaper stays paused for as long as any
      guarded op runs (a worktree create up to its budget, 3600 s from
      current servers and 140 s for older ones; fs handlers chain several
      gh/git timeouts), work queued but not yet started still runs after its
      frame is cancelled, and a true orphan waits one extra sweep (2 s).
    files:
      - omnigent/host/connect.py
      - omnigent/workspace_fs.py
      - tests/host/test_connect.py
      - tests/host/test_orphan_reaper.py
      - tests/test_workspace_fs.py
    tests:
      - tests/host/test_orphan_reaper.py
      - tests/host/test_connect.py
      - tests/test_workspace_fs.py
    budget_lines: 10
    budget_exception:
      lines: 221
      reason: >-
        Every changed file is over the XS budget. omnigent/host/connect.py
        (119 lines): eight helper call sites (five dispatch frames, three
        worktree handlers) and the reader construction, each with one anchor;
        the two-sweep zombie rule, its start-time helper, the rate-limited
        pause warning and the removed shutdown drain (67).
        omnigent/workspace_fs.py (47): the start_registry keyword and the
        non-blocking regular-file read helper used by both file-content reads.
        tests/host/test_orphan_reaper.py (221): the dispatch repro over the
        five guarded frame types; the unguarded-owner loop repro, the
        two-sweep and PID-reuse tests, the pause-warning test and the guarded
        tests' first sweeps (105). tests/host/test_connect.py (101): the
        cancellation matrix and the host reader check; two comments on the
        removed drain. tests/test_workspace_fs.py (71): the start_registry
        matrix and the FIFO refusal test.
      approver: nicholasjano (delegated)
    anchor_exempt: []
    upstream_first: false
    upstream_candidate: true

  - id: S51
    title: A child labelled omnigent.parent_wake off never wakes its parent on a block
    owner: WS-INTEGRATION
    status: landed
    category: upstreamable
    note: >-
      SubagentBlockNotifier wakes a child's parent when an approval stays
      unanswered for the 120 s grace. It now returns without waking when the
      child's omnigent.parent_wake label is exactly "off"; any other value or
      no label keeps the wake. Only these block wakes change: completion wakes
      (the runner's step-completion delivery to the parent) are not affected.
      The label is read after the grace from the child row the notifier
      already loads, so a label set during the grace is honoured and no I/O is
      added. As for a top-level session, no resolution notice is sent and the
      block stays debounced until its resolve clears it, so a label change
      takes effect from the next block. The label applies per parent-child
      link: an unlabelled middle session that receives a child's mirrored
      prompt still wakes its own parent. The key is not reserved, so callers
      set it when they create the child; the Coral session facade (SES-03)
      sets it on every child of a run anchor (the orchestrator and each step).
      The approval card is still mirrored into ancestor chats.
