  - id: S6b
    title: Stable-id elicitation verdict handlers on both answer routes
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      A component registers an async verdict handler for an id prefix
      (register_elicitation_verdict_handler: [a-z][a-z0-9_]{0,31}_, never
      elicit_, never a prefix of or prefixed by a registered one, ValueError
      otherwise; unlike the S1 and S53 registries a second registration
      raises instead of replacing, since one Coral lifespan runs per
      process). The returned unregister removes that registration only (a
      per-registration marker, so a stale uninstaller never removes a later
      registration, even of the same handler). _resolve_elicitation gains a
      keyword-only resolved_by whose default NO_CALLER names no one, and
      returns VerdictDecision | None. Its first step,
      resolve_claimed_elicitation, returns None for an unclaimed id, which
      then takes today's path byte for byte (native delivery, harness
      Future, tombstones, resolved fan-out, runner forward). A claimed id
      never reaches those. Without the handler it is refused with NO_CALLER
      (forbidden, no_caller), so the existing direct test calls cannot answer
      one, and as invalid_answer (409 on both routes) when the id is not 1-64
      of A-Za-z0-9_- or the result is invalid (the resolve URL's FastAPI body
      check answers 422 first for a malformed body). Otherwise the handler is
      awaited in the request's task, with no timeout (it bounds its own
      waits), with an ElicitationVerdict (session, id, validated result,
      resolved_by: the authenticated user, None when the request carried no
      identity). A non-duplicate acceptance publishes the resolved event with
      the verdict; clear_pending withdraws a still-pending prompt, except on
      a forbidden refusal, so a caller refused for who they are never clears
      the owner's prompt. Both touch the answered session only: claimed
      prompts are never mirrored, so nothing is published to ancestors, and
      an answer on a child cannot clear its parent's prompt. Nothing else is
      published, and the outcome stands if the handler is unregistered while
      it runs. The resolve URL and the approval event pass resolved_by=user_id
      and, for a claimed id, return verdict_response(decision) before the
      deferred policy writes: 202 {"queued": false}, with "duplicate": true
      for a duplicate, or an OmnigentError FORBIDDEN (forbidden) or CONFLICT
      with the message "[<reason>] <message>". A handler's own exception
      propagates (500, nothing published). ELICITATION_RESOLVE_LEVEL, the S53
      guard call and unclaimed ids are unchanged. The registry global carries
      the workspace-scoped-cache lint disable (keyed by prefix). The server
      tests' elicitation reset also drops handlers.
    files:
