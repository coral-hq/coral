      in-wrap pass makes a fresh 0700 dir named after the variable in the
      target's private scratch, creates each scratch_dir_files name in it as
      an empty file, sets the variable and each scratch_dir_extra_envs name to
      its absolute path over any inherited value, and removes it with the
      scratch; with no scratch it raises. The fields travel the launcher wire
      and survive clones; an old payload asks for no dir, and a malformed one,
