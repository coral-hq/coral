  - id: S117
    title: Omnigent's own runner launch of a Coral step goes through Coral's relauncher
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      Every Omnigent runner launch (a person's message after its connect
      grace, ensure_runner_connected for the resource routes and
      retry_session, a wake, a scheduled fire, the held-session relaunch)
      lands in `_launch_runner_on_host_impl`, which checked none of Coral's
      step rules, so it could replace a runner the host still called alive
      or launch on a host without the Coral runner token. helpers.py now has
      a one-owner registry, `register_runner_launch_owner`; before the
      per-session relaunch lock the latest owner sees the row and returns
      None (Omnigent launches as before), a runner id (the owner brought the
      runner up; the launch reports it acknowledged) or raises
      OmnigentError (refused). With nothing registered nothing changes.
      Coral registers `OmnigentStepRelauncher.claim_launch` with the session
      engine: a session with a `coral.run_id` label and a step binding goes
      through `ensure_runner` at its binding's generation (retryable refusal
      -> RUNNER_UNAVAILABLE, else CONFLICT); Coral's own create and relaunch
      launch of that session is let through by a context variable.
    files:
      - omnigent/server/routes/_sessions/helpers.py
    tests:
      - tests/coral/omni/test_session_facade.py
    budget_lines: 40
    anchor_exempt: []
    upstream_first: false
    upstream_candidate: false

  - id: S118
    title: No allow-listed or token-less runner proof for a Coral step's runner
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      A server started with `OMNIGENT_RUNNER_TUNNEL_TOKEN` (as `omnigent
      run`'s local one is) accepted that token, and a loopback peer with no
      token at all, as the tunnel of any path runner id, also on an accounts
      server, where the token-less peer is owned by `local`. So a step could
      connect a tunnel under another step's runner id. runner_tunnel.py takes
      `requires_bound_token(runner_id)`; when the handshake resolved no
      token-bound runner id and it says yes, the handshake closes 4004
      ("runner tunnel token is required") before hello or registration; a
      token that derives the path runner id (allow-listed or not) still
      passes. app.py passes a check that a session bound to the runner id has
      a `coral.` label (S49's `coral_bound`); Coral's supersession follower
      carries those labels to a session that takes over a step's binding. Coral runners always present the binding token their id
      derives from. identity.py adds `OMNIGENT_RUNNER_TUNNEL_TOKEN` to
      RUNNER_AUTH_SECRET_ENV_VARS, so runners strip it from every child they
      spawn. Residual: a runner zygote still forks with the host's own
      environment, so a host that exports the token still hands it to
      zygote-forked runners and harnesses; a tunnel opened before its session
      row exists is not yet seen as Coral's; the runner lookup is scoped to
      the handshake's workspace, as the tunnel's owner lookup is; a label
      carry that fails after a binding transfer is only logged, leaving the
      superseding session unfenced.
    files:
      - omnigent/runner/identity.py
      - omnigent/server/app.py
      - omnigent/server/routes/runner_tunnel.py
      - tests/runner/test_identity.py
      - tests/server/integration/test_runner_tunnel_route.py
    tests:
      - tests/runner/test_identity.py
      - tests/server/integration/test_runner_tunnel_route.py
    budget_lines: 40
    budget_exception:
      lines: 129
      reason: >-
        tests/server/integration/test_runner_tunnel_route.py gains 129 lines:
        the production app refusing a token-less loopback tunnel for a
        Coral-labelled session's runner id and taking its own binding token,
        and the route on an accounts server with an allow-list refusing the
        allow-listed and token-less tunnels for a Coral runner id from
        loopback and remote peers while another runner id keeps the
        token-less loopback path, and the proofs that still connect there (a
        remote allow-listed non-Coral runner, a Coral runner's own token, an
        allow-listed token that derives the path id). The other files are
        within budget.
      approver: nicholasjano (delegated)
    anchor_exempt: []
    upstream_first: false
    upstream_candidate: false

