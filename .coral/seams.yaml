  - id: S72
    title: Created worktrees report their start commit; listed worktrees their lock
    owner: WS-WORKSPACE
    status: landed
    category: upstreamable
    note: >-
      create_worktree reads git rev-parse HEAD in the new worktree and returns
      it as head_commit, so a caller can record the commit a worktree started
      from. The read uses the create's deadline-aware git helper after the
      worktree is complete and outside the rollback path: a non-zero exit,
      a timeout, a spent budget or any other error logs a warning and reports
      None, and the worktree is kept. A pinned-subdirectory checkout reports
      the commit it already validated without running git again. The field
      rides host.create_worktree_result as an optional head_commit and the
      server relay passes it on. The create proxy keeps it only when it is a
      full git object id (40 or 64 lowercase hex); anything else, like an
      older host's absent field, becomes None, so a host cannot plant an
      option, shell text or a huge string as a start commit. There is no
      capability token: like workspace before it, an absent field already
      means None. Upstream-first in the roadmap: the Omnigent
      PR still has to be opened by a maintainer; that does not block Coral's
      use of the field. list_worktrees also parses git's porcelain lock line
      (locked, or locked <reason>) into WorktreeInfo.locked, and the list
      handler sends it as each entry's locked key; the relay and the list proxy
      pass entries through unchanged. git worktree add holds that lock while it
      checks a worktree out and an interrupted add leaves it, so a caller can
      refuse a half-checked-out worktree instead of adopting it. Older hosts
      omit the key. worktree_parent and a list-side head stay out of scope.
    files:
      - omnigent/host/connect.py
      - omnigent/host/frames.py
      - omnigent/host/git_worktree.py
      - omnigent/server/routes/_host_worktree.py
      - omnigent/server/routes/host_tunnel.py
