        os_env helper and the CLI wrap, against a marker-holding child. The
        other files are within budget: omnigent/inner/seatbelt_sandbox.py 11,
        tests/inner/test_seatbelt_sandbox.py 23.
      approver: nicholasjano (delegated)
    anchor_exempt: []
