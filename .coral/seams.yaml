  - id: S71
    title: Host frame handlers keep their subprocess exit statuses
    owner: WS-WORKSPACE
    status: landed
    category: upstreamable
    note: >-
      The host's orphan reaper could collect a git/gh/CLI child's exit status
      before subprocess did, so a failed command reported 0. The fs request,
      fs write, skills, skill-content and credential-detection frames and the
      worktree create/remove/list handlers now run through
      _run_host_subprocess_in_thread, which keeps the reaper paused until the
      worker thread exits, even when a reconnect cancels the frame. The host
      builds its WorkspaceReaders with start_registry=False, so the change
      registry's one-time untracked-cache git probe (a persisted speed-up
      only) never runs after the guarded handler returns. A guarded worker
      that never returns would now pause the host-wide reaper until restart,
      so both WorkspaceReader file-content reads open non-blocking and refuse
      non-regular files: a FIFO in the workspace is refused instead of
      blocking the read. Other blocking reads can still hold a guarded worker:
      a hung network mount (NFS, FUSE, SMB), a stalled skills-bundle download,
      or a FIFO named SKILL.md in a skills directory (skill discovery checks
      exists() and then reads it). Known costs:
      the reaper stays paused for as long as
      any guarded op runs (a worktree create up to its budget, 3600 s from
      current servers and 140 s for older ones; fs handlers chain several
      gh/git timeouts), and work queued but not yet started still runs after
      its frame is cancelled. Still unguarded: the launch preflight --version
      probes, model_options, MCP stdio and opencode-serve spawns, the
      pr_resource discovery pool and the azure-devops-fetch thread.
      Follow-ups: a rate-limited warning when the reaper has been paused for
      more than 60 s, and a two-sweep zombie rule (reap a pid only when it was
      already a zombie on the previous sweep), which would cover every
      unguarded spawner and end the pauses.
    files:
      - omnigent/host/connect.py
      - omnigent/workspace_fs.py
      - tests/host/test_connect.py
      - tests/host/test_orphan_reaper.py
      - tests/test_workspace_fs.py
    tests:
      - tests/host/test_orphan_reaper.py
      - tests/host/test_connect.py
      - tests/test_workspace_fs.py
    budget_lines: 10
    budget_exception:
      lines: 116
      reason: >-
        Every changed file is over the XS budget. omnigent/host/connect.py
        (52 lines): eight helper call sites (five dispatch frames, three
        worktree handlers) and the reader construction, each with one anchor.
        omnigent/workspace_fs.py (47): the start_registry keyword and the
        non-blocking regular-file read helper used by both file-content reads.
        tests/host/test_orphan_reaper.py (116): the dispatch repro over the
        five guarded frame types. tests/host/test_connect.py (97): the
        cancellation matrix and the host reader check. tests/test_workspace_fs.py
        (71): the start_registry matrix and the FIFO refusal test.
      approver: nicholasjano (delegated)
    anchor_exempt: []
    upstream_first: false
    upstream_candidate: true

  - id: S51
    title: A child labelled omnigent.parent_wake off never wakes its parent on a block
    owner: WS-INTEGRATION
    status: landed
    category: upstreamable
    note: >-
      SubagentBlockNotifier wakes a child's parent when an approval stays
      unanswered for the 120 s grace. It now returns without waking when the
      child's omnigent.parent_wake label is exactly "off"; any other value or
      no label keeps the wake. Only these block wakes change: completion wakes
      (the runner's step-completion delivery to the parent) are not affected.
      The label is read after the grace from the child row the notifier
      already loads, so a label set during the grace is honoured and no I/O is
      added. As for a top-level session, no resolution notice is sent and the
      block stays debounced until its resolve clears it, so a label change
      takes effect from the next block. The label applies per parent-child
      link: an unlabelled middle session that receives a child's mirrored
      prompt still wakes its own parent. The key is not reserved, so callers
      set it when they create the child; the Coral session facade (SES-03)
      sets it on every child of a run anchor (the orchestrator and each step).
      The approval card is still mirrored into ancestor chats.
    files:
      - omnigent/runtime/subagent_block_notifier.py
      - omnigent/util/session_lifecycle.py
      - tests/runtime/test_subagent_block_notifier.py
      - tests/server/integration/test_session_host_launch.py
    tests:
      - tests/runtime/test_subagent_block_notifier.py
