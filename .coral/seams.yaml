  - id: S42
    title: EngineEventContext for request-free engine sends
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      startup_inputs gains EngineEventContext(app, user_id), an in-process
      engine sender with no HTTP request whose headers are always empty (no
      caller can pass any, so no runner tunnel credential rides an engine
      send), and the SessionEventDispatch protocol for the shared handler.
      Callers pass the run owner's authenticated user id, never a value taken
      from request input. The event routes accept it wherever the startup and
      runner contexts are accepted: it is authorized as its own user_id, never
      a header identity, and its message is dispatched at once instead of
      being saved behind a managed session's startup. From it,
      _post_event_impl accepts only message, interrupt and stop_session
      (anything else is FORBIDDEN) and refuses a message whose first text
      starts with ! or / after leading whitespace (INVALID_INPUT), before any
      dispatch, so no shell or slash command runs through an engine brief. A
      host refusal in the host-bound relaunch ladder raises RUNNER_UNAVAILABLE
      for it instead of recording a failed turn and reporting queued; a side
      chat's source-relaunch refusal still records a failed turn (Coral step
      sessions are never side chats). The other request-only and startup-only
      branches are unchanged, so the closed check, input policy, owner-only
      stop and interrupt behave as for an HTTP sender. The context has no
      connection to wait on, so an ASK input policy ends as a deny at once
      (a residual in docs/coral/contracts/session-facade.md).
