  - id: S121
    title: The macOS sandbox keeps the pasteboard, Spotlight and Apple Events out of reach
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      Measured on macOS 26.3.1: the step profile's broad (allow mach-lookup)
      let a sandboxed shell look up com.apple.pasteboard.1 (it read and wrote
      a private named pasteboard, so the general pasteboard too),
      com.apple.metadata.mds (mdfind listed folders the file rules hide) and
      com.apple.coreservices.appleevents. Every profile _build_profile emits
      (the os_env step shell, every spawn-time CLI wrap and sandboxed
      terminal panes) now denies, after the broad allow and in the
      global-name-prefix form S111 uses, the com.apple.pasteboard.,
      com.apple.coreservices.uasharedpasteboard (Universal Clipboard),
      com.apple.metadata., com.apple.spotlight., com.apple.corespotlight and
      com.apple.coreservices.appleevents lookups. Inside the sandbox those
      lookups fail, a named pasteboard reads and writes nothing and mdfind
      returns nothing, while osascript and notifyd still work; python, node,
      git and the claude CLI still start, and a claude -p Bash-tool turn
