  - id: S114
    title: The codex-native app-server WebSocket requires a per-spawn capability token
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      Measured on macOS 26.3.1 with codex-cli 0.171.0 and opencode 2.1.4: a
      sandboxed step with the network on reaches every loopback TCP listener,
      and the codex-native app-server WebSocket was the one Omnigent listener
      that took no secret, so a step could start, steer or interrupt another
      session's turns. A loopback ws:// app-server (the session one and the
      discovery ones) now starts with --ws-auth capability-token
      --ws-token-file, its token a fresh secrets.token_urlsafe(32) in a 0600
      file under <data dir>/codex-native/ws-tokens/<port> (0700 dir, symlinked
      or foreign ancestors refused); the token never goes on argv and the file
      is removed when that app-server stops. CodexAppServerClient.connect
      sends it as a Bearer only to a loopback IP-literal ws:// port with a
      token file, through a logger that never logs headers at DEBUG, so no
      call site changes; the route-turn hook command carries the data dir,
      since codex strips OMNIGENT_* from its env; the TUI gets --remote-auth-token-env
      OMNIGENT_CODEX_WS_TOKEN only when a token exists, and the variable in
      its environment, and a caller may no longer pass that flag. A codex
      whose app-server --help has no --ws-auth (probed once per binary) logs
      one warning naming its version and runs without a token, as before; a
      probe that cannot run is not cached and passes --ws-auth anyway.
