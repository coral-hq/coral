  - id: S10
    title: Server tool registry and its /mcp call site
    owner: WS-INTEGRATION
    status: landed
    category: coral-specific
    note: >-
      `omnigent/server/server_tools.py` holds a process-wide, lock-guarded
      registry of server tools keyed by tool name. register_server_tool(name,
      handler) refuses a name that is not a valid extension tool name
      (S50's is_extension_tool_name: fullmatch, no `__`) or starts with
      `sys_` (framework tools keep their own handling, such as
      sys_advise_models); registering a name again replaces it, with a
      warning when the handler changes; it returns an idempotent unregister
      that removes only its own registration, so an older unregister never
      removes a newer registration, even of the same handler.
      server_tool(name) returns None for a name that is not a string, strips
      one leading `mcp__omnigent__` and does an exact lookup.
      granted_server_tool(name, spec) returns the handler only when an
      installed tool provider (S50) offers that tool for the session's spec,
      the name is not a framework tool's (S7's rule, shared as
      is_framework_tool_name: any `sys_` name, a builtin registry name or a
      skill tool), the spec declares no local tool of that name (the runner
      keeps the spec's own tool, S7) and, for the `mcp__omnigent__` form, the
      spec has no MCP server named `mcp` (whose tools share that prefix).
      Providers are consulted only for a registered name. run_server_tool
      awaits the handler; an exception (not cancellation) or a result that
      is not a ServerToolResult with string text is logged with the session
      id and answered "server tool failed; see the server log" as an error.
      `_handle_mcp_tools_call` in orchestration.py runs the lookup right
      after the sys_advise_models intercept, so after TOOL_CALL policy
      (DENY, ASK and its approved retry, ALLOW transforms) and before the
      runner forward, and only when no backend executor is passed (the MCP
      gateway adapter's service tools never reach it). Arguments that are
      not a dict (from the caller or a policy transform) get -32000 and
      never reach the handler. It builds a ServerToolCall (session id, bare
      name, the policy-owned arguments dict, the caller's operation id,
      runner proof from S49, the policy actor), returns -32000 with the
      text for an error result and an MCP text result otherwise, and skips
      TOOL_RESULT policy, redaction policies included, as advise does. S10
      authorizes nothing beyond the route's edit access: each handler checks
      runner_proven and the operation id itself and treats both, and the
      arguments, as untrusted. S10 sets no time limit, so handlers bound their
      own work; the runner may resend an operation id while the first call
      runs. No approved_after_ask flag. With nothing registered the proxy is
      unchanged, malformed names included. Residuals: one registry per
      process (the later lifespan's registration wins); on the runner's
      direct-stream path a per-request client tool named like a tool granted
      to the session is answered by the server tool (S8 already forwards
      it); a Python tool file's `@tool` function named unlike the file but
      like a granted tool is answered by the server tool (spec-local tools
      are known by file stem, as in the runner's own check).
    files:
